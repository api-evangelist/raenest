name: Raenest
description: 'Raenest (formerly Geegpay) is a global money platform for freelancers,
  creators, remote workers, students, and businesses in Africa and beyond. It provides
  multi-currency accounts in USD, GBP, EUR, USDT, and USDC, virtual and physical Visa
  cards, international payment collection from 190+ countries, smart invoicing tools,
  US stock investing, stablecoin support, and a rewards program. Raenest is delivered
  through its mobile and web apps (app.raenest.com); as of this enrichment pass it
  publishes no public developer API, SDKs, or API documentation. Backed by QED Investors
  and Techstars.'
